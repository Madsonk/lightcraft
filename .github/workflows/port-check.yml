name: port-check
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Upstream tag to merge (e.g. v0.20.0). Empty = latest upstream release.'
        required: false
        type: string
permissions:
  contents: write
jobs:
  check:
    runs-on: macos-14
    env:
      APP: lightcraft
      UPSTREAM_REPO: storytold/lightcraft
    steps:
      - uses: actions/checkout@v4
        with: { ref: madson, fetch-depth: 0 }
      - name: Configure
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" || git remote set-url upstream "https://github.com/${UPSTREAM_REPO}.git"
          git config rerere.enabled true
          git config user.name "madson-port-bot"
          git config user.email "madson-port-bot@users.noreply.github.com"
      - name: Resolve tag
        id: tag
        env: { GH_TOKEN: ${{ github.token }} }
        run: |
          TAG="${{ inputs.upstream_tag }}"
          if [ -z "$TAG" ]; then TAG=$(gh release view --repo "${UPSTREAM_REPO}" --json tagName -q .tagName); fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - run: git fetch upstream --tags
      - name: Merge (best-effort)
        id: merge
        run: |
          TAG='${{ steps.tag.outputs.tag }}'
          if git merge-base --is-ancestor "$TAG" HEAD; then echo "result=up-to-date" >> "$GITHUB_OUTPUT"; exit 0; fi
          git tag -f "madson-avant-${TAG#v}" HEAD || true
          if git merge --no-commit --no-ff "$TAG"; then git commit -m "Port ${TAG#v}: merge upstream $TAG (bot)" || true; echo "result=merged" >> "$GITHUB_OUTPUT"; else echo "result=conflict" >> "$GITHUB_OUTPUT"; git merge --abort || true; fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.merge.outputs.result == 'merged'
      - name: cargo check
        if: steps.merge.outputs.result == 'merged'
        run: cargo check -p lightcraft-engine --features faces,autoseg -p lightcraft-ui-egui -p lightcraft-cli
      - name: Push
        if: steps.merge.outputs.result == 'merged'
        run: |
          git push origin madson
          git push origin "madson-avant-${{ steps.tag.outputs.tag }}" || true
      - run: echo "port-check $APP ${{ steps.tag.outputs.tag }} => ${{ steps.merge.outputs.result || 'n/a' }}"
