[package]
name = "lightcraft-catalog"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LightCraft library: photos, albums, ratings/flags, search/filter/sort, op-log persistence (L3)"

[lints]
workspace = true

[dependencies]
lightcraft-develop = { workspace = true }
lightcraft-meta = { workspace = true }
lightcraft-lens = { workspace = true }
lightcraft-places = { workspace = true, optional = true }
lightcraft-geom = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
crc32fast = { workspace = true }
log = { workspace = true }
web-time = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[features]
# Photos without a place keyword are placed by their GPS position (offline reverse geocoding). Off for the web build.
places = ["dep:lightcraft-places"]
