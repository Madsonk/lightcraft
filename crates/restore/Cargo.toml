[package]
name = "lightcraft-restore"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
description = "LightCraft AI denoise (SCUNet) and 2x super-resolution (SPAN): tiled inference in pure Rust on candle (L3)"

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
log = { workspace = true }
miniz_oxide = { workspace = true }
rayon = { workspace = true }

# the networks run natively only (the web build has no AI restore)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
candle-core = { workspace = true }
candle-nn = { workspace = true }
lightcraft-fetch = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { workspace = true, features = ["metal"] }
candle-nn = { workspace = true, features = ["metal"] }

[dev-dependencies]
image = { workspace = true }
