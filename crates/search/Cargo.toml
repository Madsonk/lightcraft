[package]
name = "lightcraft-search"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
description = "LightCraft semantic photo search: SigLIP image and text embeddings in pure Rust, the vector index (L3)"

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
siphasher = { workspace = true }

# the model runs natively only (the web build has no semantic search)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
candle-core = { workspace = true }
candle-nn = { workspace = true }
lightcraft-fetch = { workspace = true }
half = "2"
rayon = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { workspace = true, features = ["metal"] }
candle-nn = { workspace = true, features = ["metal"] }

[dev-dependencies]
image = { workspace = true }
