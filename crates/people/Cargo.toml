[package]
name = "lightcraft-people"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LightCraft people: ArcFace face embeddings on a pure-Rust ONNX interpreter, the face index, grouping of the faces of one person (L3)"

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
half = "2"
siphasher = { workspace = true }
lightcraft-facemesh = { workspace = true }

# the recognizer runs natively only (the web build has no face recognition)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
candle-core = { workspace = true }
lightcraft-inpaint = { workspace = true }

[dev-dependencies]
image = { workspace = true }
