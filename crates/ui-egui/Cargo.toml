[package]
name = "lightcraft-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LightCraft egui frontend (Lightroom-style UI); swappable — nothing below depends on it (L5)"

[lints]
workspace = true

[dependencies]
lightcraft-geom = { workspace = true }
lightcraft-meta = { workspace = true }
lightcraft-color = { workspace = true }
lightcraft-raster = { workspace = true }
lightcraft-develop = { workspace = true }
lightcraft-pipeline = { workspace = true }
lightcraft-catalog = { workspace = true }
# the system language on the first run (v14, French locale): no dependency on macOS, Linux or Windows
sys-locale = "0.3"
web-time = { workspace = true }
lightcraft-engine = { workspace = true }
lightcraft-preview = { workspace = true }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[dev-dependencies]
lightcraft-denoise = { workspace = true, features = ["runtime"] }
lightcraft-codecs = { workspace = true }
lightcraft-faces = { workspace = true }
# the People tests inject faces into the index (no model needed); the model-setup tests need the
# denoise runtime the apps build with (`cargo test --workspace` unifies it, `-p lightcraft-ui-egui` did not)
lightcraft-engine = { workspace = true, features = ["people", "places", "denoise"] }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
