[package]
name = "lightcraft-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LightCraft engine: session, command registry, history, render jobs, view-models (L4)"

[lints]
workspace = true

[dependencies]
lightcraft-geom = { workspace = true }
lightcraft-color = { workspace = true }
lightcraft-raster = { workspace = true }
lightcraft-develop = { workspace = true }
lightcraft-scenes = { workspace = true }
lightcraft-pipeline = { workspace = true }
lightcraft-gpu = { workspace = true }
lightcraft-catalog = { workspace = true }
web-time = { workspace = true }
lightcraft-preview = { workspace = true }
lightcraft-codecs = { workspace = true }
lightcraft-raw = { workspace = true }
lightcraft-meta = { workspace = true }
miniz_oxide = { workspace = true }
lightcraft-merge = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
ab_glyph = { workspace = true }
lightcraft-segment = { workspace = true, optional = true }
lightcraft-faces = { workspace = true, optional = true }
lightcraft-restore = { workspace = true, optional = true }
lightcraft-depth = { workspace = true, optional = true }
lightcraft-inpaint = { workspace = true, optional = true }
lightcraft-fetch = { workspace = true, optional = true }
png = { workspace = true, optional = true }
lightcraft-search = { workspace = true, optional = true }

[features]
# AI masks with SAM 3 (Object / Describe). Off for the web and CLI builds.
sam = ["dep:lightcraft-segment", "dep:lightcraft-fetch"]
# Analyze Faces (eyes open / closed, eye sharpness) with MediaPipe Face Landmarker. Off for the web build.
faces = ["dep:lightcraft-faces", "dep:lightcraft-fetch"]
# AI denoise (SCUNet) and 2x super-resolution (SPAN) of exports. Off for the web build.
restore = ["dep:lightcraft-restore", "dep:lightcraft-fetch"]
# Depth Anything V2 Small: depth maps, Lens Blur and the Depth Range mask (`depth.*`). Off for the web build.
depth = ["dep:lightcraft-depth", "dep:lightcraft-fetch", "dep:png"]
# Object removal by inpainting with MI-GAN (`spot.inpaint`). Off for the web build.
inpaint = ["dep:lightcraft-inpaint", "dep:lightcraft-fetch"]
# Semantic search (SigLIP) and near-duplicate detection. Off for the web build.
search = ["dep:lightcraft-search", "dep:lightcraft-fetch"]

[dev-dependencies]
libc = { workspace = true }
