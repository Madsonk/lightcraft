[package]
name = "lightcraft-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LightCraft engine: session, command registry, history, render jobs, view-models (L4)"

[lints]
workspace = true

[dependencies]
# Paths stored in a Lightroom catalog are followed only to local files or the catalog's share.
craft-docpath = { workspace = true }
lightcraft-geom = { workspace = true }
lightcraft-color = { workspace = true }
lightcraft-raster = { workspace = true }
lightcraft-develop = { workspace = true }
lightcraft-scenes = { workspace = true }
lightcraft-pipeline = { workspace = true }
lightcraft-gpu = { workspace = true }
lightcraft-catalog = { workspace = true }
web-time = { workspace = true }
lightcraft-preview = { workspace = true }
lightcraft-codecs = { workspace = true }
lightcraft-raw = { workspace = true }
lightcraft-denoise-core = { workspace = true }
lightcraft-denoise = { workspace = true, optional = true }
lightcraft-meta = { workspace = true }
lightcraft-lensdb = { workspace = true }
lightcraft-faces = { workspace = true }
miniz_oxide = { workspace = true }
siphasher = { workspace = true }
lightcraft-merge = { workspace = true }
lightcraft-geocode = { workspace = true }
lightcraft-slideshow = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
ab_glyph = { workspace = true }
# Apply the font’s vertical substitutions and origins to Japanese watermarks.
harfrust = { version = "0.13", default-features = false, features = ["std"] }
unicode-normalization = "0.1"
unicode-segmentation = "1.13"
lightcraft-segment = { workspace = true, optional = true }
lightcraft-restore = { workspace = true, optional = true }
lightcraft-retouch = { workspace = true }
lightcraft-culler = { workspace = true }
lightcraft-style = { workspace = true }
lightcraft-autoframe = { workspace = true }
lightcraft-facemesh = { workspace = true, optional = true }
lightcraft-autoseg = { workspace = true, optional = true }
lightcraft-depth = { workspace = true, optional = true }
lightcraft-migan = { workspace = true, optional = true }
png = { workspace = true, optional = true }
lightcraft-search = { workspace = true, optional = true }
lightcraft-taste = { workspace = true, optional = true }

# model downloads run natively only (the web build fetches no models)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lightcraft-fetch = { workspace = true }
# capture-time parsing for face recognition (native only)
chrono = { workspace = true }
# free space of the drive holding the preview cache (the low-disk alert; pure Rust: rustix / windows-sys)
fs4 = { workspace = true }

[features]
# Analyze Faces (eyes open / closed, eye sharpness, the mesh of the portrait sliders) with MediaPipe Face Landmarker. Off for the web build.
faces = ["dep:lightcraft-facemesh"]
# Semantic search (SigLIP) and near-duplicate detection. Off for the web build.
search = ["dep:lightcraft-search", "dep:lightcraft-taste"]
# Automatic masks: SegFormer (sky, people, landscape) and an ISNet matting network (subject). Off for the web build.
autoseg = ["dep:lightcraft-autoseg"]
# Depth Anything V2 Small: depth maps, Lens Blur and the Depth Range mask (`depth.*`). Off for the web build.
depth = ["dep:lightcraft-depth", "dep:png"]
# Object removal by inpainting with MI-GAN (`spot.inpaint`). Off for the web build.
migan = ["dep:lightcraft-migan"]
# AI masks with SAM 3 (Object / Describe). Off for the web and CLI builds.
sam = ["dep:lightcraft-segment"]
# AI denoise (SCUNet) and 2x super-resolution (SPAN) of exports. Off for the web build.
restore = ["dep:lightcraft-restore"]
denoise = ["dep:lightcraft-denoise", "lightcraft-denoise/runtime", "lightcraft-gpu/denoise"]
rawnind-model = ["denoise", "lightcraft-denoise/rawnind-model", "lightcraft-denoise-core/rawnind-model"]

[dev-dependencies]
# tests record why they skip (`cargo xtask ci` lists the skips)
lightcraft-testkit = { workspace = true }
# HDR JPEG XL tests read the file's colour encoding
jxl-oxide = { workspace = true }
# Lossless synthetic HEIC files (the import test; decoded when the codecs' `heif` feature is on).
lightcraft-heif = { workspace = true, features = ["testdata"] }
libc = { workspace = true }
lightcraft-tiff = { workspace = true }
