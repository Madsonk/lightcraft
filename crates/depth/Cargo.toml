[package]
name = "lightcraft-depth"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
description = "LightCraft monocular depth: Depth Anything V2 Small inference in pure Rust (L3)"

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
lightcraft-raster = { workspace = true }

# the model runs natively only (the web build has no depth estimation)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
candle-core = { workspace = true }
candle-nn = { workspace = true }
lightcraft-fetch = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { workspace = true, features = ["metal"] }
candle-nn = { workspace = true, features = ["metal"] }

[dev-dependencies]
image = { workspace = true }
